name: Deploy Django App via Ansible

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to AWS Instances
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python for Ansible
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Install Ansible and required collections
      - name: Install Ansible & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.docker

      # 4. Generate inventory dynamically from secret
      - name: Generate Ansible Inventory
        env:
          INVENTORY_SECRET: ${{ secrets.INVENTORY }}
        run: |
          mkdir -p ansible
          echo "$INVENTORY_SECRET" > ansible/inventory.ini
          # Strip any private key accidentally pasted into the inventory secret.
          # The real key is supplied via --private-key below, so no key belongs here.
          sed -i \
            -e '/ansible_ssh_private_key_file/d' \
            -e '/-----BEGIN.*PRIVATE KEY-----/d' \
            -e '/-----END.*PRIVATE KEY-----/d' \
            ansible/inventory.ini
          # Drop leftover base64 key-body lines (pure base64, no '_', no spaces).
          sed -i -E '/^[A-Za-z0-9+/]{32,}={0,2}$/d' ansible/inventory.ini
          echo "Sanitized inventory:"
          cat ansible/inventory.ini

      # 4b. Write the SSH private key to a file (path, not inline content)
      - name: Set up SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ansible
          echo "$SSH_PRIVATE_KEY" > ansible/ssh_key.pem
          chmod 600 ansible/ssh_key.pem

      # 5. Run the Ansible playbook with extra vars
      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_FORCE_COLOR: "1"
          ENV_CONTENT: ${{ secrets.ENV }}
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml \
            --private-key ansible/ssh_key.pem \
            --extra-vars "lb_dns_name=${{ secrets.LBDNS }}" \
            --extra-vars "{\"app_env_content\": $(jq -Rs . <<< "$ENV_CONTENT")}"