name: Deploy Django App via Ansible

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Allows you to manually trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy to AWS Instances
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python for Ansible
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Install Ansible and required collections
      - name: Install Ansible & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install community.docker

      # 5. Generate inventory.ini dynamically from secrets
      - name: Generate Ansible Inventory
        run: |
          mkdir -p ansible
          echo ${{ secrets.INVENTORY }} > ansible/inventory.ini
          
          cat ansible/inventory.ini

      # 6. Run the Ansible playbook
      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml \
            --extra-vars "lb_dns_name=${{ secrets.LBDNS }}"
